[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o-linux"
version = "0.1.0"
description = "Persistent Linux, host command bridges, and OSTADIX system workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Lee Daghlar Ostadi", email = "ostadi.lee@gmail.com"}]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/lostadi/o-linux"
Issues = "https://github.com/lostadi/o-linux/issues"

[project.scripts]
o-linux = "olinux.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]
